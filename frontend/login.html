<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — UrjaSense AI</title><link rel="icon" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="topnav"><div class="inner">
  <a class="brand" href="index.html"><img src="assets/images/logo.svg" alt=""><b>URJASENSE <span>AI</span></b></a>
  <nav><select class="lang-select"></select><a class="btn btn-light btn-sm" href="register.html" data-i18n="register">Register</a></nav>
</div></header>
<main class="auth-wrap"><div class="auth-card">
  <h1 data-i18n="login">Log in</h1>
  <p style="color:var(--muted)">Residents, linemen and administrators sign in here.</p>
  <form id="auth-form" data-mode="login" novalidate>
    <div class="field"><label for="email" data-i18n="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password" data-i18n="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <p class="error-text" id="form-error" role="alert"></p>
    <button class="btn btn-primary" style="width:100%" type="submit" data-i18n="login">Log in</button>
  </form>
  <p style="text-align:center">New resident? <a href="register.html" data-i18n="register">Register</a></p>
  <div class="demo-box"><b data-i18n="demo_accounts">Demo accounts (sample data)</b><br>Password for all: <code>Demo@1234</code><br>
    <button class="btn btn-outline btn-sm" type="button" data-demo="resident1@urjasense.demo">Resident</button>
    <button class="btn btn-outline btn-sm" type="button" data-demo="lineman1@urjasense.demo">Lineman</button>
    <button class="btn btn-outline btn-sm" type="button" data-demo="admin@urjasense.demo">Admin</button></div>
</div></main>
<script src="js/i18n.js"></script><script src="js/main.js"></script><script src="js/auth.js"></script>
</body></html>
